<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>创建者验证｜生命科学科研调研</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="creator-page">
    <main class="creator-shell">
      <a class="brand" href="./index.html">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M14 9c12 0 20 10 20 22M34 9C22 9 14 19 14 31M10 17h28M10 31h28" /></svg></span>
        <span>生命科学科研调研</span>
      </a>
      <section class="login-card">
        <span class="section-kicker">创建者专属</span>
        <div id="login-view">
          <h1>运营面板访问验证</h1>
          <p>请输入创建者口令和认证器中的六位动态验证码。</p>
          <form id="creator-login" class="creator-form">
            <label for="creator-password">创建者口令</label>
            <input id="creator-password" name="password" type="password" minlength="12" maxlength="256" autocomplete="current-password" required />
            <label for="creator-totp">动态验证码</label>
            <input id="creator-totp" name="totp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required />
            <p id="creator-error" class="form-error" role="alert"></p>
            <button type="submit">安全登录</button>
          </form>
        </div>
        <div id="dashboard-view" hidden>
          <h1>创建者控制台</h1>
          <p>身份验证成功。这里只显示汇总数据；导出文件需由创建者主动生成。</p>
          <div class="notice"><p><strong>当前状态</strong><br><span id="creator-status">正在读取……</span></p></div>
          <dl class="creator-metrics" aria-label="调研任务汇总">
            <div><dt>任务总数</dt><dd id="metric-jobs">—</dd></div>
            <div><dt>完成任务</dt><dd id="metric-completed">—</dd></div>
            <div><dt>来源记录</dt><dd id="metric-sources">—</dd></div>
            <div><dt>估算费用</dt><dd id="metric-cost">—</dd></div>
          </dl>
          <button id="creator-export" type="button">导出安全数据副本</button>
          <p id="export-status" class="export-status" role="status"></p>
          <button id="creator-logout" type="button">退出登录</button>
        </div>
        <a class="back-link" href="./index.html">← 返回调研首页</a>
      </section>
    </main>
    <script src="./creator.js" defer></script>
  </body>
</html>
